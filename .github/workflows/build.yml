name: Build PeviitorSetup Script

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

# Add permissions
permissions:
  contents: write          # Allow writing to repository
  actions: read           # Allow reading actions
  checks: write           # Allow writing checks

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # Step 1: Download your repository code
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0      # Fetch full history
        
    # Step 2: Run your build script
    - name: Build Combined Script
      run: |
        Write-Host "Starting build process..."
        if (Test-Path "src\Build.ps1") {
          cd src
          .\Build.ps1 -Verbose
          Write-Host "Build completed successfully!"
        } else {
          Write-Error "Build.ps1 not found in src\ directory!"
          exit 1
        }
      shell: pwsh
      
    # Step 3: Check if there are changes to commit
    - name: Check for Changes
      id: changes
      run: |
        git add dist/
        if (git diff --staged --quiet) {
          Write-Host "No changes detected"
          echo "has_changes=false" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "Changes detected in dist/ folder"
          echo "has_changes=true" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
      
    # Step 4: Commit and push changes (only if there are changes)
    - name: Commit Built Files
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "🤖 Auto-build: Updated PeviitorSetup.ps1 [skip ci]"
        git push
        Write-Host "✅ Successfully pushed updated build files"
      shell: pwsh
      
    # Step 5: Upload to release (if this is a release)
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/PeviitorSetup.ps1
        asset_name: PeviitorSetup.ps1
        asset_content_type: text/plain
