name: 🚀 Peviitor.ro Installer Builder

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build-installer:
    name: 📦 Build Installation Script
    runs-on: windows-latest
    
    steps:
    - name: 📥 Download Source Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        # For releases, checkout the main branch instead of the tag
        ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
        
    - name: 🔨 Compile Modules into Single Script
      run: |
        Write-Host "🔧 Starting Peviitor.ro installer compilation..." -ForegroundColor Cyan
        if (Test-Path "src\Build.ps1") {
          cd src
          .\Build.ps1 -Verbose
          Write-Host "✅ Compilation successful!" -ForegroundColor Green
        } else {
          Write-Error "❌ Build.ps1 not found!"
          exit 1
        }
      shell: pwsh
      
    - name: 🔍 Check for Changes
      id: changes
      run: |
        git add dist/
        if (git diff --staged --quiet) {
          Write-Host "ℹ️ No changes detected"
          echo "has_changes=false" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "✨ New build detected!"
          echo "has_changes=true" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
      
    # Only commit changes if this is a push (not a release)
    - name: 💾 Save Built Installer to Main Branch
      if: steps.changes.outputs.has_changes == 'true' && github.event_name != 'release'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "🤖 Peviitor Builder Bot"
        git commit -m "🎯 Auto-build: Updated installer v$(Get-Date -Format 'yyyyMMdd-HHmm') [skip ci]"
        git push origin main
        Write-Host "🚀 Successfully updated installer on main branch!" -ForegroundColor Green
      shell: pwsh
      
    # For releases, just build and attach (don't commit back)
    - name: 📎 Attach to Release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/PeviitorSetup.ps1
        asset_name: PeviitorSetup.ps1
        asset_content_type: text/plain
        
    # Also create a downloadable artifact for every build
    - name: 📤 Create Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PeviitorSetup-${{ github.run_number }}
        path: |
          ./dist/PeviitorSetup.ps1
          ./dist/VERIFICATION.md
        retention-days: 30
