name: 🚀 Peviitor.ro Installer Builder

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build-installer:                    # ← Custom job name
    name: 📦 Build Installation Script  # ← Custom display name
    runs-on: windows-latest
    
    steps:
    - name: 📥 Download Source Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: 🔨 Compile Modules into Single Script
      run: |
        Write-Host "🔧 Starting Peviitor.ro installer compilation..." -ForegroundColor Cyan
        if (Test-Path "src\Build.ps1") {
          cd src
          .\Build.ps1 -Verbose
          Write-Host "✅ Compilation successful!" -ForegroundColor Green
        } else {
          Write-Error "❌ Build.ps1 not found!"
          exit 1
        }
      shell: pwsh
      
    - name: 🔍 Check for Changes
      id: changes
      run: |
        git add dist/
        if (git diff --staged --quiet) {
          Write-Host "ℹ️ No changes detected"
          echo "has_changes=false" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "✨ New build detected!"
          echo "has_changes=true" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
      
    - name: 💾 Save Built Installer
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "🤖 Peviitor Builder Bot"
        git commit -m "🎯 Auto-build: Updated installer v$(Get-Date -Format 'yyyyMMdd-HHmm') [skip ci]"
        git push
        Write-Host "🚀 Successfully deployed new installer!" -ForegroundColor Green
      shell: pwsh
      
    - name: 📎 Attach to Release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/PeviitorSetup.ps1
        asset_name: PeviitorSetup.ps1
        asset_content_type: text/plain
